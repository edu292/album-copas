[project]
name = "album-copas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=6.1.3",
    "django-image-toolkit==1.1.3",
    "pillow>=13.0.0",
    "requests>=2.34.2",
]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "album_copas.settings"

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pytest-django>=4.14.0",
]
